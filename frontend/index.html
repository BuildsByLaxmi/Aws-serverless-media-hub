<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Media Pipeline (Supabase)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}
.card{border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:center}
.card img{width:80px;height:80px;object-fit:cover;border-radius:6px;background:#eee}
.s{font-weight:600}.COMPLETED{color:#0a7d2c}.FAILED{color:#b00020}</style></head><body>
<h1>Media Pipeline</h1><p>Upload an image or video (max 50 MB). Processed in a Python worker, served via signed URLs.</p>
<input type="file" id="f" accept="image/*,video/*"> <button id="b">Upload</button> <span id="msg"></span>
<h2>Results</h2><div id="list"></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
